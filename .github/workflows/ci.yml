# CI mỗi PR — spec §9: lint → typecheck → unit → integration → build → audit
# Ba job SONG SONG, tách theo loại hạ tầng cần thiết:
#   ci       — backend + check kiến trúc (cần Testcontainers: Postgres/Redis/MinIO)
#   web-test — FE tầng 1→4 (jsdom + MSW + story), KHÔNG cần Docker → chạy nhanh
#   web-e2e  — FE tầng 5 (Playwright trên build production, API mock ở route)
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Backend + kiến trúc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # fetch-depth: 0 là BẮT BUỘC, không phải tối ưu.
      # Clone nông không có `origin/main`, và check nào so diff với nhánh gốc
      # (check-fe-test-coverage, check-pr-size) sẽ TỰ BỎ QUA — chúng đã chạy
      # rỗng ở mọi PR trước khi dòng này tồn tại.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Nhánh gốc phải có mặt dưới dạng origin/<base> để check diff có mốc so.
      # PR: github.base_ref; push lên main: chính main.
      - name: Nạp nhánh gốc cho check diff
        run: |
          BASE="${{ github.base_ref || 'main' }}"
          git fetch --no-tags --prune origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
          git rev-parse --verify "origin/$BASE"

      - name: Check kiến trúc (tenancy vét cạn, ma trận §6.5, cấm role branching, audit coverage, token 3 tầng, SQL thô)
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: node tools/checks/run-all.mjs

      # Vượt ngưỡng §6 thì ĐỎ, trừ khi mô tả PR có dòng `PR-SIZE-OK: <lý do>`.
      # Cảnh báo suông không ai phải trả lời nên sau vài lần sẽ bị lờ.
      - name: Kích thước PR so với working-agreement §6
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        # ĐỌC MÔ TẢ PR TỪ API, không dùng `github.event.pull_request.body`.
        # Payload sự kiện bị ĐÓNG BĂNG lúc sự kiện phát sinh: sửa mô tả để thêm
        # `PR-SIZE-OK:` rồi bấm "re-run" vẫn dùng mô tả CŨ, nên check vẫn đỏ.
        # Tức là thông báo lỗi bảo người ta làm một việc KHÔNG có tác dụng.
        run: |
          PR_BODY="$(curl -sS -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER"             | python3 -c 'import sys,json; print(json.load(sys.stdin).get("body") or "")')"
          export PR_BODY
          node tools/checks/check-pr-size.mjs

      - name: Prisma generate
        run: pnpm --filter @nexus/api prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Testcontainers (global-setup) TỰ set DATABASE_URL/REDIS_URL/JWT_SECRET —
      # env ở đây là thừa và gây hiểu lầm rằng CI dùng DB ngoài
      - name: Test backend (unit + integration qua Testcontainers)
        run: pnpm --filter @nexus/api test

      - name: Build
        run: pnpm build

      - name: Audit
        run: pnpm audit --audit-level high || true # cảnh báo, chưa chặn ở GĐ1

  web-test:
    name: FE tầng 1-4 (unit · component · MSW · story)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # FE import type từ @nexus/shared (main → dist/) và @nexus/api-client
      # (cần Prisma type). Thiếu bước này typecheck/build FE đỏ với
      # "Cannot find module '@nexus/shared'" — job ci không lộ vì nó có `build`.
      - name: Build shared + Prisma generate (điều kiện type của FE)
        run: |
          pnpm --filter @nexus/shared build
          pnpm --filter @nexus/api prisma:generate

      - name: Typecheck web (app + file test)
        run: pnpm --filter @nexus/web typecheck

      - name: "Test FE (vitest — unit + component + MSW + story)"
        run: pnpm --filter @nexus/web test

      # Story build chứng minh MỌI story compile được với framework thật
      - name: Build Storybook
        run: pnpm --filter @nexus/web run build-storybook --quiet

  web-e2e:
    name: FE tầng 5 (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # FE import type từ @nexus/shared (main → dist/) và @nexus/api-client
      # (cần Prisma type). Thiếu bước này typecheck/build FE đỏ với
      # "Cannot find module '@nexus/shared'" — job ci không lộ vì nó có `build`.
      - name: Build shared + Prisma generate (điều kiện type của FE)
        run: |
          pnpm --filter @nexus/shared build
          pnpm --filter @nexus/api prisma:generate

      - name: Cài trình duyệt Playwright
        run: pnpm --filter @nexus/web e2e:install

      # playwright.config tự chạy `pnpm build && pnpm start` (webServer).
      # Gồm cả visual regression theo preset (fe-preset-system §8.2) và a11y
      # theo preset (§8.3) — ảnh baseline commit kèm là bản chụp trên LINUX
      # (hậu tố -chromium-linux), khớp runner này.
      - name: E2E + visual regression + a11y theo preset
        run: pnpm --filter @nexus/web e2e

      # Ảnh diff là thứ DUY NHẤT giải thích được vì sao visual regression đỏ;
      # không tải lên thì người xem CI chỉ thấy "1 test failed".
      - name: Lưu báo cáo và ảnh diff khi đỏ
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  generator:
    name: Test #37 — generator gen:module
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # fetch-depth: 0 để `git diff --exit-code` ở bước cuối so được với gốc
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared + Prisma generate
        run: |
          pnpm --filter @nexus/shared build
          pnpm --filter @nexus/api prisma:generate

      # Test này SỬA repo rồi dọn lại: sinh module, chèn model, khai registry,
      # chạy test sinh kèm. Chạy job riêng để một lần đỏ giữa chừng không để
      # lại rác cho job khác.
      - name: Test #37 (4 khẳng định)
        run: node tools/test-generator.mjs

      # Kiểm chính HÀM DỌN DẸP của test: dọn sót thì đỏ ở đây.
      # Không có bước này thì test có thể "xanh" mà để lại model tạm trong
      # schema, và PR sau sẽ mang theo rác không ai để ý.
      - name: Dọn dẹp có sạch không
        run: |
          git status --porcelain
          git diff --exit-code
          test -z "$(git status --porcelain)" || {
            echo "::error::Test #37 để lại file thừa — sửa hàm cleanup() trong tools/test-generator.mjs"
            exit 1
          }

  onboarding:
    name: Onboarding — clone sạch chạy được không
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # Checkout vào THƯ MỤC RIÊNG, không dùng workspace mặc định.
      # Đây là điểm cốt lõi của job: mô phỏng `git clone` của người mới, chứ
      # không phải một workspace đã được các bước trước chuẩn bị sẵn.
      - uses: actions/checkout@v4
        with:
          path: clone-sach

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      # KHÔNG `cache: pnpm`. Clone sạch trên máy mới KHÔNG có cache, và F-01/
      # F-02 lộ ra CHÍNH VÌ thiếu thứ mà máy quen việc đã có sẵn. Bật cache ở
      # đây là che đúng loại lỗi job này tồn tại để tìm.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Chạy ĐÚNG lệnh README nói, không thêm bước nào. Nếu job này cần một
      # bước mà README không nhắc, thì README sai — sửa README, đừng sửa job.
      - name: pnpm install && pnpm bootstrap (đo giờ)
        working-directory: clone-sach
        run: |
          START=$(date +%s)
          pnpm install
          pnpm bootstrap
          END=$(date +%s)
          echo "SETUP_SECONDS=$((END-START))" >> "$GITHUB_ENV"
          echo "⏱  pnpm bootstrap: $((END-START)) giây"

      - name: Khởi động app như người mới
        working-directory: clone-sach
        run: |
          nohup pnpm --filter @nexus/api dev > /tmp/api.log 2>&1 &
          nohup pnpm --filter @nexus/web dev > /tmp/web.log 2>&1 &
          echo "đang chờ hai tiến trình lên…"

      # Bằng chứng DƯƠNG TÍNH: không chỉ "job xanh" mà phải có 200 thật.
      - name: /health và trang chủ phải trả 200
        run: |
          # -L: `/` chuyển hướng 307 sang /login khi chưa đăng nhập — đó là
          # hành vi ĐÚNG của app. Đòi 200 ngay ở `/` là check sai, không phải
          # app sai (working-agreement §4.1b: check PHẢI ĐÚNG). Ta đi theo
          # chuyển hướng và đòi 200 ở ĐÍCH — vẫn là "trang tải được thật".
          ok() {
            for i in $(seq 1 60); do
              code=$(curl -sL -o /dev/null -w '%{http_code}' -m 10 "$1" || true)
              if [ "$code" = "200" ]; then
                final=$(curl -sL -o /dev/null -w '%{url_effective}' -m 10 "$1")
                echo "✓ $1 → 200 (đích: $final)"
                return 0
              fi
              sleep 5
            done
            echo "::error::$1 KHÔNG trả 200 sau 5 phút (mã cuối: $code)"
            return 1
          }
          ok http://localhost:4000/api/v1/health || { tail -40 /tmp/api.log; exit 1; }
          ok http://localhost:3000              || { tail -40 /tmp/web.log; exit 1; }

      # README cam kết dưới 30 phút. Vượt thì ĐỎ — README sai thì sửa README,
      # không phải nới ngưỡng.
      - name: So thời gian với cam kết của README
        run: |
          # 300s, không phải 1800s. Đo thật trên runner sạch: 48s. Ngưỡng 30
          # phút của README là lời hứa cho NGƯỜI (máy nhà còn phải tải image
          # lần đầu); ngưỡng ở đây là gác HỒI QUY trên CI. Để 1800 thì check
          # không bao giờ đỏ được, tức là một check không làm gì cả.
          LIMIT=300
          echo "pnpm bootstrap: ${SETUP_SECONDS}s · ngưỡng hồi quy CI: ${LIMIT}s"
          if [ "$SETUP_SECONDS" -gt "$LIMIT" ]; then
            echo "::error::Setup ${SETUP_SECONDS}s VƯỢT ngưỡng ${LIMIT}s (đo nền: 48s). Onboarding đã chậm đi gấp 6 lần — tìm nguyên nhân, đừng nới ngưỡng."
            exit 1
          fi
          echo "::notice::Onboarding sạch: ${SETUP_SECONDS}s / ${LIMIT}s cam kết"
