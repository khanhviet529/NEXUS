# [CORE] Hạ tầng dev cục bộ — spec §2.1, §9
# Chạy: make setup  (hoặc docker compose -f docker-compose.dev.yml up -d)
# Đặt được từ env (F-04). Hardcode `nexus-dev` làm CLONE THỨ HAI dùng chung
# container, volume và DATABASE với clone thứ nhất — chạy migrate/seed ở clone
# mới sẽ ghi đè dữ liệu của clone cũ, không cảnh báo gì.
# Đây là lỗi DUY NHẤT trong 12 phát hiện C0 có thể phá dữ liệu repo gốc.
name: ${COMPOSE_PROJECT_NAME:-nexus-dev}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # ltree + pg_trgm bật sẵn cho DB dev (spec §2.3, §3.5)
      - ./tools/db/init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nexus
      MINIO_ROOT_PASSWORD: nexus-minio
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025" # web UI
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP

volumes:
  pgdata:
  miniodata:
